<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerMudhra AI Assistant</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #000207;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8fafc;
      --accent: #131314;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: 0 auto;
      border-inline: 1px solid #f1f1f1;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #eff6ff;
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 750;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .source {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .source:hover {
      color: var(--accent);
    }

    #chat {
      flex: 1;
      padding: 28px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome {
      margin: auto;
      max-width: 480px;
      text-align: center;
      padding: 35px 12px;
    }

    .welcome .spark {
      font-size: 28px;
      color: var(--accent);
    }

    .welcome h2 {
      font-size: 25px;
      letter-spacing: -.6px;
      margin: 8px 0;
    }

    .welcome p {
      color: var(--muted);
      margin: 0 auto 20px;
      max-width: 390px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 100%;
      align-items: flex-start;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(720px, 88%);
      padding: 12px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: var(--soft);
      border: 1px solid #eef0f3;
      border-top-left-radius: 5px;
    }

    .user .bubble {
      background: var(--accent);
      color: white;
      border-top-right-radius: 5px;
    }

    .avatar {
      flex: 0 0 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      background: #eff6ff;
      color: var(--accent);
    }

    .user .avatar {
      order: 2;
      background: #e5e7eb;
      color: #374151;
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
      padding: 14px 22px 10px;
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 3px 14px #00000008;
    }

    textarea {
      flex: 1;
      border: 0;
      outline: 0;
      resize: none;
      min-height: 42px;
      max-height: 150px;
      padding: 10px 8px;
      font: inherit;
      background: transparent;
      color: var(--ink);
    }

    #send {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 11px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
    }

    #send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin: 8px 0 0;
    }

    /* Markdown response formatting */

    .bubble h1,
    .bubble h2,
    .bubble h3,
    .bubble h4 {
      margin: 14px 0 8px;
      line-height: 1.35;
    }

    .bubble p {
      margin: 8px 0;
    }

    .bubble ul,
    .bubble ol {
      padding-left: 24px;
      margin: 8px 0;
    }

    .bubble li {
      margin: 4px 0;
    }

    .bubble strong {
      font-weight: 700;
    }

    .bubble em {
      font-style: italic;
    }

    .bubble table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
    }

    .bubble th,
    .bubble td {
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      text-align: left;
    }

    .bubble th {
      background: #eef2f7;
      font-weight: 700;
    }

    .bubble blockquote {
      border-left: 3px solid #cbd5e1;
      margin: 10px 0;
      padding: 4px 12px;
      color: #4b5563;
    }

    .bubble pre {
      overflow-x: auto;
      padding: 12px;
      border-radius: 8px;
      background: #eef2f7;
    }

    .bubble code {
      font-family: monospace;
      font-size: 0.9em;
    }

    .bubble a {
      color: #2563eb;
      text-decoration: underline;
    }

    .bubble > :first-child {
      margin-top: 0;
    }

    .bubble > :last-child {
      margin-bottom: 0;
    }

    .error {
      color: #b91c1c;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 16px;
      }

      #chat {
        padding: 20px 14px 14px;
      }

      .composer-wrap {
        padding: 10px 12px 8px;
      }

      .source {
        display: none;
      }

      .welcome h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <div class="logo">CM</div>

      <div>
        <h1>CareerMudhra Assistant</h1>
        <p>Factual college, course, fee and admissions information</p>
      </div>

      <a
        class="source"
        href="https://careermudhra.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        CareerMudhra.com ↗
      </a>
    </header>

    <section id="chat" aria-live="polite">

      <div class="welcome" id="welcome">
        <div class="spark">✳</div>

        <h2>What information can I help you find?</h2>

        <p>
          Ask about colleges, courses, fees, or admissions
        </p>
      </div>

    </section>

    <div class="composer-wrap">

      <form id="form" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Please enter your query"
          aria-label="Your message"
        ></textarea>

        <button
          id="send"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>
      </form>

      <p class="note">
        Demo version: CEC_V3.html
      </p>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function renderMarkdown(element, markdown) {
      const html = marked.parse(markdown || "", {
        gfm: true,
        breaks: true
      });

      element.innerHTML = DOMPurify.sanitize(html);
    }

    function addMessage(text, role, isError = false) {
      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      const row = document.createElement("div");

      row.className = `msg ${
        role === "user" ? "user" : "assistant"
      }`;

      const avatar = document.createElement("div");

      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "CM";

      const bubble = document.createElement("div");

      bubble.className = "bubble" + (isError ? " error" : "");
      renderMarkdown(bubble, text);

      row.append(avatar, bubble);

      chat.appendChild(row);

      row.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });

      return bubble;
    }


    async function sendMessage(message) {
      const text = message.trim();

      if (!text || send.disabled) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      input.style.height = "auto";

      send.disabled = true;

      const thinking = addMessage("Thinking…", "assistant");

      try {
        const response = await fetch("/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.error || `Request failed (${response.status}).`
          );
        }

        const answer = (data.answer || "").trim();

        renderMarkdown(thinking, answer || "I couldn't generate a response. Please try again.");

        if (!answer) {
          thinking.classList.add("error");
        }

      } catch (error) {
        console.error("Chat request failed:", error);

        thinking.textContent =
          error instanceof TypeError
            ? "Could not connect to the chatbot server. Make sure app.py is running and open this page at http://127.0.0.1:5000."
            : (error.message || "Sorry, something went wrong. Please try again.");

        thinking.classList.add("error");

      } finally {
        send.disabled = false;

        input.focus();

        thinking.scrollIntoView({
          behavior: "smooth",
          block: "end"
        });
      }
    }


    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });


    input.addEventListener("input", () => {
      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 150) + "px";
    });


    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

  </script>
</body>
</html>
